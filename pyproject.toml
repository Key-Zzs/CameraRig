[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-rig"
version = "0.1.0"
description = "Single-camera acquisition, calibration, validation, and replay contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Key-Zzs" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "numpy>=1.26,<2.4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
realsense = [
  "pyrealsense2==2.58.3.10794",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.22",
]

[project.scripts]
camera-rig = "camera_rig.cli.main:main"

[project.urls]
Repository = "https://github.com/Key-Zzs/CameraRig"
Issues = "https://github.com/Key-Zzs/CameraRig/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.data-files]
"share/camera-rig/schemas" = ["schemas/*.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_rig = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["camera_rig"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = ["hardware: requires physical camera hardware"]
