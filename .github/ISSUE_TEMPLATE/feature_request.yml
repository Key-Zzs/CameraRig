name: Feature request
description: Propose a change within CameraRig's single-camera boundary
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What single-camera problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and public contract.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Scope check
      options:
        - label: This request does not add multi-camera ownership or downstream processing.
          required: true
