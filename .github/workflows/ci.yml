name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test without hardware
        run: pytest -m "not hardware"
      - name: Build distributions
        run: python -m build

  consumer-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core package and consumer test tools
        run: python -m pip install -e . build mypy pytest
      - name: Test stable consumer API
        run: pytest tests/consumer -q
      - name: Type-check downstream sample
        run: mypy tests/typecheck/consumer_api.py
      - name: Build core wheel
        run: python -m build --wheel
      - name: Smoke-test core-only wheel
        run: |
          python -m venv .local/wheel-smoke-v1-core
          .local/wheel-smoke-v1-core/bin/python -m pip install dist/camera_rig-*.whl
          .local/wheel-smoke-v1-core/bin/python -I - <<'PY'
          import importlib.util
          from pathlib import Path

          import camera_rig
          import camera_rig.api
          from camera_rig.api import (
              CameraBundle,
              FixedMountCalibration,
              ReplayCameraSession,
              RigidTransform,
              load_camera_bundle,
          )

          assert camera_rig.__version__ == "1.1.0.dev0"
          assert importlib.util.find_spec("pyrealsense2") is None
          bundle = load_camera_bundle(
              Path("tests/fixtures/consumer/fixed_camera_bundle_v1.json")
          )
          assert isinstance(bundle, CameraBundle)
          assert isinstance(bundle.fixed_mount_calibration, FixedMountCalibration)
          assert isinstance(
              bundle.fixed_mount_calibration.T_parent_from_camera_reference,
              RigidTransform,
          )
          assert ReplayCameraSession is camera_rig.api.ReplayCameraSession
          PY

  realsense-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install RealSense extra
        run: python -m pip install -e ".[realsense]"
      - name: Import official wheel without hardware
        run: python -c "import pyrealsense2"

  charuco-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ChArUco extra
        run: python -m pip install -e ".[dev,charuco]"
      - name: Test ChArUco specification, generation, geometry, and detection
        run: pytest -m "charuco and not hardware"

  provision-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install fixed-provisioning extra
        run: python -m pip install -e ".[dev,provision]"
      - name: Test complete fixed-provisioning workflow without hardware
        run: pytest -m "not hardware"
