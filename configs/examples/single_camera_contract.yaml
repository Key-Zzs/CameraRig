# Public contract example. Replace the serial in a private local configuration.
schema_version: camera-rig.config.v1

camera:
  name: head
  driver: realsense
  expected_model: D435i
  serial: "REPLACE_WITH_DEVICE_SERIAL"
  output_reference_stream: ir_left

streams:
  color:
    enabled: true
    width: 640
    height: 480
    fps: 30
    format: rgb8
  depth:
    enabled: true
    width: 640
    height: 480
    fps: 30
    format: z16
  ir_left:
    enabled: true
    width: 640
    height: 480
    fps: 30
    format: y8
  ir_right:
    enabled: true
    width: 640
    height: 480
    fps: 30
    format: y8

capture:
  warmup_frames: 30
  timeout_ms: 1500
  copy_frames: true
