name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Test without hardware
        run: pytest -m "not hardware"
      - name: Build distributions
        run: python -m build

  realsense-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install RealSense extra
        run: python -m pip install -e ".[realsense]"
      - name: Import official wheel without hardware
        run: python -c "import pyrealsense2"

  charuco-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install ChArUco extra
        run: python -m pip install -e ".[dev,charuco]"
      - name: Test ChArUco specification, generation, geometry, and detection
        run: pytest -m "charuco and not hardware"
