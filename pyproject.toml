[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-rig"
version = "1.1.0.dev0"
description = "Single-camera acquisition, calibration, validation, and replay contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Key-Zzs" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.22,<5",
  "numpy>=1.26,<2.4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
realsense = [
  "pyrealsense2==2.58.3.10794",
]
viz = [
  "Pillow>=10,<13",
]
charuco = [
  "opencv-contrib-python-headless==4.14.0.94",
  "reportlab>=4.2,<5",
]
provision = [
  "pyrealsense2==2.58.3.10794",
  "opencv-contrib-python-headless==4.14.0.94",
  "reportlab>=4.2,<5",
  "Pillow>=10,<13",
]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.22",
]

[project.scripts]
camera-rig = "camera_rig.cli.main:main"

[project.urls]
Repository = "https://github.com/Key-Zzs/CameraRig"
Issues = "https://github.com/Key-Zzs/CameraRig/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.data-files]
"share/camera-rig" = ["API_STABILITY.md"]
"share/camera-rig/schemas" = ["schemas/*.json"]
"share/camera-rig/configs/examples" = [
  "configs/examples/charuco_custom_page_v2.yaml",
  "configs/examples/fixed_provision_contract.yaml",
]
"share/camera-rig/benchmarks" = [
  "benchmarks/pose_observability_benchmark.py",
  "benchmarks/reprojection_policy_holdout.py",
  "benchmarks/reprojection_policy_sweep.py",
  "benchmarks/structured_reprojection_gate.py",
]
"share/camera-rig/release_manifests" = ["release_manifests/*.json"]
"share/camera-rig/docs" = [
  "docs/bootstrap-qualification.md",
  "docs/bootstrap-qualification.zh-CN.md",
  "docs/calibration-quality.md",
  "docs/charuco-target.md",
  "docs/fixed-camera-calibration.md",
  "docs/fixed-camera-provisioning.md",
  "docs/downstream-integration.md",
  "docs/public-api.md",
  "docs/pose-observability-design.md",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
camera_rig = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["camera_rig"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "PIL", "PIL.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "hardware: requires physical camera hardware",
  "charuco: requires the charuco optional dependency",
]
