# Generated custom-page example. This is not an identification of any existing physical board.
schema_version: camera-rig.target.charuco.v2

target:
  name: charuco_custom_500x700_generated
  plugin: charuco
  target_frame: charuco_target
  dictionary: DICT_6X6_250
  squares_x: 5
  squares_y: 7
  square_length_m: 0.100
  marker_length_m: 0.075
  border_bits: 1
  legacy_pattern: false

coordinate_frame:
  origin: outer_bottom_left
  x_axis: board_right
  y_axis: board_up
  z_axis: out_of_printed_face

print:
  mode: generated
  page:
    type: custom
    width_mm: 500.0
    height_mm: 700.0
  layout:
    board_x_mm: 0.0
    board_y_mm: 0.0
  dpi: 300
  board_only: true
  scale_check:
    enabled: true
    separate_page: true
    horizontal_length_mm: 200.0
    vertical_length_mm: 200.0
